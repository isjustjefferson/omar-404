name: Backend CI

on:
  push:
    branches: [main, develop]
    paths: 
      - 'backend/**'
  pull_request:
    branches: [main, develop]
    paths: 
      - 'backend/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ./backend

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependências
        run: npm ci

      - name: Verificar sintaxe (syntax check)
        run: |
          for file in $(find . -name "*.js" -not -path "./node_modules/*"); do
            node --check "$file" || exit 1
          done
      
      - name: Tentar iniciar o servidor (smoke test)
        env: 
          PORT: 3000
          DB_HOST: localhost
          DB_PORT: 5432
          DB_NAME: omar404
          DB_USER: postgres
          DB_PASSWORD: postgres
          JWT_SECRET: ci_test_secret
          # REDIS_URL: redis://localhost:6379
          REDIS_URL: redis://127.0.0.1:6379
          EMAIL_USER: test@test.com
          EMAIL_PASS: test
          EMAIL_FROM: test@test.com
        run: |
          timeout 5 node index.js || true
          
  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy na EC2 via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/omar-404
            git fetch origin
            git checkout main
            git reset --hard origin/main
            docker compose down
            docker compose up -d --build
            docker compose ps
